# The BEAM lowering of the engine: the purerl package set and purs-backend-erl
# (from purerl-tidal's own node_modules). The engine's js-bigints resolves to
# the purerl port in purerl-tidal/vendor/js-bigints here.
package:
  name: tidal-engine-column-erlang
  dependencies:
    - effect
    - prelude
    - tidal-engine
workspace:
  packageSet:
    url: https://raw.githubusercontent.com/purerl/package-sets/erl-0.15.3-20220629/packages.json
  extraPackages:
    tidal-engine:
      path: ../../core
    js-bigints:
      path: ../../../vendor/js-bigints
  backend:
    cmd: "../../../node_modules/.bin/purs-backend-erl"
