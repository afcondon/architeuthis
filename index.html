<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algorave Visualizer - Tidal → MIDI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">

  <!-- App is bundled with esbuild, all dependencies included -->

  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #14141f;
      --surface-light: #1e1e2e;
      --primary: #6366f1;
      --accent: #f472b6;
      --success: #10b981;
      --warning: #f59e0b;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    /* App layout */
    .algorave-app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .app-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .app-header h1 {
      font-size: 1.25rem;
      color: var(--accent);
      font-weight: 600;
    }

    .app-header .subtitle {
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    .app-container {
      display: flex;
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* Slide panel */
    .slide-panel {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 60px;
      width: 320px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 100;
      overflow-y: auto;
      padding: 16px;
    }

    .slide-panel--open {
      transform: translateX(0);
    }

    .panel-toggle {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 101;
      background: var(--surface-light);
      border: 1px solid var(--border);
      border-left: none;
      color: var(--text);
      padding: 12px 8px;
      cursor: pointer;
      border-radius: 0 4px 4px 0;
      transition: left 0.3s ease, background 0.2s;
    }

    .slide-panel--open + .panel-toggle {
      left: 320px;
    }

    .panel-toggle:hover {
      background: var(--primary);
    }

    /* Control panel */
    .control-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .control-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-section label {
      color: var(--text-dim);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    textarea, input, select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
    }

    textarea:focus, input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    .button-row {
      display: flex;
      gap: 8px;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      flex: 1;
    }

    .btn-secondary {
      background: var(--surface-light);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-accent {
      background: var(--accent);
      color: white;
      width: 100%;
    }

    .error {
      color: var(--warning);
      font-size: 0.8rem;
      padding: 8px;
      background: rgba(245, 158, 11, 0.1);
      border-radius: 4px;
    }

    /* Preset grid */
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .preset-btn {
      background: var(--surface-light);
      color: var(--text-dim);
      padding: 6px 8px;
      font-size: 0.75rem;
      border: 1px solid var(--border);
    }

    .preset-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Track list */
    .track-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .track-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 10px;
      background: var(--bg);
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .track-item:hover {
      background: var(--surface-light);
    }

    .track-item.track-muted {
      opacity: 0.5;
    }

    .track-name {
      color: var(--accent);
      font-weight: 500;
    }

    .track-pattern {
      color: var(--text-dim);
      font-size: 0.8rem;
    }

    /* Code output */
    .code-output {
      background: var(--bg);
      padding: 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      overflow-x: auto;
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
    }

    /* Visualization container */
    .viz-container {
      flex: 1;
      background: var(--bg);
      overflow: hidden;
    }

    .viz-container svg {
      width: 100%;
      height: 100%;
    }

    /* MIDI panel */
    .midi-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 20px;
    }

    .midi-controls {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .midi-output, .midi-bpm {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .midi-output label, .midi-bpm label {
      color: var(--text-dim);
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    .midi-output select {
      width: auto;
      min-width: 200px;
    }

    .midi-bpm input {
      width: 80px;
      text-align: center;
    }

    .btn-play {
      background: var(--success);
      color: white;
      padding: 10px 24px;
      font-weight: 600;
    }

    .btn-stop {
      background: var(--warning);
      color: white;
      padding: 10px 24px;
      font-weight: 600;
    }

    .midi-status {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-left: auto;
    }

    /* Tangle interactive elements */
    .tangle-toggle {
      cursor: pointer;
      color: var(--primary);
    }

    .tangle-toggle:hover {
      text-decoration: underline;
    }

    .tangle-adjust {
      cursor: ew-resize;
      color: var(--accent);
      border-bottom: 1px dashed var(--accent);
    }

    .tangle-disabled {
      opacity: 0.5;
      text-decoration: line-through;
    }

    /* Sunburst/tree styles (for D3 viz) */
    .sunburst-arc {
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .sunburst-arc:hover {
      opacity: 0.8;
    }

    .tree-node {
      cursor: pointer;
    }

    .tree-node text {
      font-size: 10px;
      fill: var(--text);
    }

    .tree-link {
      fill: none;
      stroke: var(--border);
      stroke-width: 1px;
    }

    /* Combinator badges */
    .combinator-badge {
      font-size: 9px;
      fill: var(--text-dim);
    }

    /* Muted track overlay */
    .track-muted-overlay {
      fill: var(--bg);
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <script type="module">
    import { main } from './dist/app.js';
    main();
  </script>
</body>
</html>
