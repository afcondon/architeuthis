package:
  name: purerl-tidal
  description: TidalCycles mini-notation parser for PureScript/Erlang
  dependencies:
    - arrays
    - console
    - control
    - effect
    - either
    - erl-binary
    - erl-cowboy
    - erl-kernel
    - erl-lists
    - erl-maps
    - erl-process
    - erl-tuples
    - foldable-traversable
    - foreign
    - integers
    - maybe
    - newtype
    - numbers
    - ordered-collections
    - parsing
    - prelude
    - rationals
    - refs
    - simple-json   # reef's wire codec (Reef.Protocol); transitive via reef but
                    # declared here so spago pulls it into the purerl build closure
    - strings
    - transformers
    - tuples
    - harmonia
    - reef
    - js-bigints   # the purerl port (../../littorina/vendor/js-bigints)
    - littorina    # Tidal's engine: patterns, mini-notation, line language
    - hawser       # wire descriptions; the OSC encoder comes from them
    - rig-wires    # what Diaphus and es9-daemon read (binnacle/wires)
  # Without this section spago compiles src/ only, and `make test` ran
  # whatever test modules were last compiled (2026-05-08) rather than test/.
  test:
    main: Test.Main
    dependencies:
      - exceptions

workspace:
  extraPackages:
    # Published library, pulled from the git tag (the legacy purerl package set
    # can't take a registry-version dep; a git ref builds against this set the
    # same way the local path-dep did, on both backends).
    harmonia:
      git: https://github.com/afcondon/purescript-harmonia.git
      ref: v0.2.0
    # Portable virtual-module engines. Path-dep during Phase-1 dev; the Odonus
    # voice will call Reef.Odonus.stepEmit@ps (replacing odonus_engine.erl).
    reef:
      path: ../../reef
    # Tidal's engine, one source for the BEAM and JS, held to Haskell Tidal by
    # its own conformance suite (music/littorina; `make conformance` there).
    # It was engine/ here until 2026-10-01.
    littorina:
      path: ../../littorina/core
    js-bigints:
      path: ../../littorina/vendor/js-bigints
    # The OSC sent to Diaphus and es9-daemon is encoded from these
    # descriptions (src/rig_wire.erl), not by hand. Declarations and vectors:
    # binnacle/conformance. Hawser needs the purerl ports of three packages
    # the purerl set lacks.
    rig-wires:
      path: ../binnacle/wires
    hawser:
      path: ../../../purescript-hylograph-libs/purescript-hawser
    st:
      path: ../../../purescript-backends/purerl-ports/st
    foreign-object:
      path: ../../../purescript-backends/purerl-ports/foreign-object
    argonaut-core:
      path: ../../../purescript-backends/purerl-ports/argonaut-core
  packageSet:
    url: https://raw.githubusercontent.com/purerl/package-sets/erl-0.15.3-20220629/packages.json
  backend:
    cmd: "node_modules/.bin/purs-backend-erl"
