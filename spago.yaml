package:
  name: purerl-tidal
  description: TidalCycles mini-notation parser for PureScript/Erlang
  dependencies:
    - arrays
    - console
    - control
    - effect
    - either
    - erl-binary
    - erl-cowboy
    - erl-kernel
    - erl-lists
    - erl-maps
    - erl-process
    - erl-tuples
    - foldable-traversable
    - foreign
    - integers
    - maybe
    - newtype
    - numbers
    - ordered-collections
    - parsing
    - prelude
    - rationals
    - refs
    - simple-json   # reef's wire codec (Reef.Protocol); transitive via reef but
                    # declared here so spago pulls it into the purerl build closure
    - strings
    - transformers
    - tuples
    - harmonia
    - reef
  # Without this section spago compiles src/ only, and `make test` ran
  # whatever test modules were last compiled (2026-05-08) rather than test/.
  test:
    main: Test.Main
    dependencies:
      - exceptions

workspace:
  extraPackages:
    # Published library, pulled from the git tag (the legacy purerl package set
    # can't take a registry-version dep; a git ref builds against this set the
    # same way the local path-dep did, on both backends).
    harmonia:
      git: https://github.com/afcondon/purescript-harmonia.git
      ref: v0.2.0
    # Portable virtual-module engines. Path-dep during Phase-1 dev; the Odonus
    # voice will call Reef.Odonus.stepEmit@ps (replacing odonus_engine.erl).
    reef:
      path: ../../reef
  packageSet:
    url: https://raw.githubusercontent.com/purerl/package-sets/erl-0.15.3-20220629/packages.json
  backend:
    cmd: "node_modules/.bin/purs-backend-erl"
