package:
  name: purerl-tidal
  description: TidalCycles mini-notation parser for PureScript/Erlang
  dependencies:
    - arrays
    - console
    - control
    - effect
    - either
    - erl-binary
    - erl-cowboy
    - erl-kernel
    - erl-lists
    - erl-maps
    - erl-process
    - erl-tuples
    - foldable-traversable
    - foreign
    - integers
    - maybe
    - newtype
    - numbers
    - ordered-collections
    - parsing
    - prelude
    - rationals
    - refs
    - strings
    - transformers
    - tuples
    - harmonia

workspace:
  extraPackages:
    harmonia:
      path: ../../harmonia
  packageSet:
    url: https://raw.githubusercontent.com/purerl/package-sets/erl-0.15.3-20220629/packages.json
  backend:
    cmd: "node_modules/.bin/purs-backend-erl"
